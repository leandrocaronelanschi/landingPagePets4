<article class="card card--testimonial" id="template-card-testimonials">
  <div class="container-assessment">
    <div class="assessment-testimonials">
      <span class="title-assessment">Avaliação</span>
    </div>
    <div
      class="testimonial__stars"
      id="stars_testimonials"
      aria-label="Avaliação 5 de 5 estrelas"
    >
      ⭐⭐⭐⭐⭐
    </div>
  </div>
  <p
    class="testimonial__text"
    id="card-testimonial-phrase"
    data-field="phrase"
  ></p>
  <div class="testimonial__author">
    <div class="avatar-group">
      <img
        src="https://placehold.co/100x100/F4D068/3A342E?text=Tutor"
        alt="Foto do tutor"
        class="avatar avatar--person img-placeholder"
        data-field="tutor-photo"
      />
      <img
        src="https://placehold.co/100x100/FF8A5B/FFFFFF?text=Pet"
        alt="Foto do pet"
        class="avatar avatar--pet img-placeholder"
        data-field="pet-photo"
      />
    </div>
    <div class="testimonial__names">
      <h4 class="testimonials-name-tutor-pet" data-field="name-tutor-pet"></h4>
      <h4 class="city-uf-tutor" data-field="tutor-city-uf"></h4>
    </div>
  </div>
</article>
